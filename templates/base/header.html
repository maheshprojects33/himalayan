{% load static %}

<header class="header">
  <div class="container header__inner">
    <a class="brand" href="{% url 'home' %}" aria-label="Himalayan Foundation home">
      <img src="{% static 'assets/img/logo.png' %}" alt="Himalayan Foundation logo">
      <span class="brand__name">Himalayan Network
        <span class="brand__tag">Handcrafted in Nepal</span>
      </span>
    </a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav" id="site-nav">
      <ul class="nav__list">
        <li><a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a> </li>
        <li><a href="{% url 'about' %}" class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}">About</a></li>
        <li><a href="{% url 'products' %}" class="{% if request.resolver_match.url_name == 'products' %}active{% endif %}">Products</a></li>
        <li><a href="{% url 'craft' %}" class="{% if request.resolver_match.url_name == 'craft' %}active{% endif %}">Our Craft</a></li>
        <li><a href="{% url 'sustainability' %}" class="{% if request.resolver_match.url_name == 'sustainability' %}active{% endif %}">Sustainability</a></li>
        <li class="nav__cta"><a class="btn" href="{% url 'contact' %}">Enquire Now</a></li>
      </ul>
    </nav>
  </div>
</header>
