{% load static %}
<section class="section section--tint" id="founder">
  <div class="container founder">
    <div class="founder__media reveal">
      <img src="{{ message.image.url }}" alt="Message from our CEO" loading="lazy" />
    </div>
    <div class="founder__body reveal">
      <span class="eyebrow">Message from our CEO</span>
      <h2>&ldquo;{{ message.title }}&rdquo;</h2>
      <p class="founder__quote">{{ message.msg_higlight }}</p>
      <p>{{ message.message|safe }}</p>
      
      <div class="signature">
        <img src="{% static 'assets/img/signature.png' %}" alt="Signature of Surendra Shakya" />
        <strong>Surendra Shakya</strong>
        <span>Chief Executive Officer</span>
      </div>
    </div>
  </div>
</section>
