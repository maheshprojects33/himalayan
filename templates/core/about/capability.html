{% load static %}

<section class="section section--tint">
  <div class="container split split--reverse">
    <div class="split__media reveal">
      <img src="{{ capabilities.image.url }}" alt="Hand-finished statues" loading="lazy" />
    </div>
    <div class="reveal">
      <span class="eyebrow">Capability</span>
      <h2>{{ capabilities.title }}</h2>
      <ul class="ticks">
        {% for point in capabilities.points_list %}
        <li>{{ point }}</li>
        {% endfor %}
        
      </ul>
      <div class="btn-row">
        <a class="btn" href="{% url 'contact' %}">Start a conversation</a>
      </div>
    </div>
  </div>
</section>
