{% load static %}
<section class="section">
  <div class="container">
    <div class="section-head center reveal">
      <span class="eyebrow">What guides us</span>
      <h2>Our values</h2>
    </div>
    <div class="grid grid--3">
      {% for value in our_values %}
        <div class="step reveal">
          <span class="step__no">{{ value.s_no }}</span><h3>{{ value.title }}</h3><p>{{ value.description }}</p>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
