{% load static %}

<section class="section">
  <div class="container split">
    <div class="split__media reveal">
      <img src="{{ our_story.image.url }}" alt="{{ our_story.title }}" loading="lazy" />
    </div>
    <div class="reveal">
      <span class="eyebrow">Our story</span>
      <h2>{{ our_story.title }}</h2>
      <p class="lead">{{ our_story.note }}</p>
      <p>{{ our_story.description|linebreaksbr }}</p>
    </div>
  </div>
</section>
