{% load static %}
<section class="section section--tint">
  <div class="container">
    <div class="section-head center reveal">
      <span class="eyebrow">What we make</span>
      <h2>Our product families</h2>
      <p class="lead">Four distinct crafts, each rooted in a Nepali tradition and produced to consistent export quality.</p>
    </div>
    <div class="grid grid--4">
      {% for item in what_we_make %}
      <article class="card reveal">
        <div class="card__media"><img src="{{ item.image.url }}" alt="{{ item.image_alt }}" loading="lazy"></div>
        <div class="card__body">
          <h3>{{ item.title }}</h3>
          <p>{{ item.description }}</p>
          <a class="link-arrow" href="{% url 'products' %}">View range &rarr;</a>
        </div>
      </article>
      {% endfor %}
    </div>
    <div class="btn-row" style="justify-content:center">
      <a class="btn" href="{% url 'products' %}">View all products</a>
    </div>
  </div>
</section>
