{% load static %}
<section class="section">
  <div class="container split">
    <div class="split__media reveal">
      <img src="{{ who_we_are.image.url }}" alt="Who We Are" loading="lazy" />
    </div>
    <div class="reveal">
      <span class="eyebrow">Who we are</span>
      <h2>{{ who_we_are.title }}</h2>
      <p class="lead">{{ who_we_are.description }}</p>
      <ul class="ticks">
        {% for point in who_we_are.points_list %}
          <li>{{ point }}</li>
        {% endfor %}
      </ul>
      
      <div class="btn-row">
        <a class="btn btn--ghost" href="{% url 'about' %}">More about us</a>
      </div>
    </div>
  </div>
</section>
