{% load static %}
<section class="section">
  <div class="container">
    <div class="section-head center reveal">
      <span class="eyebrow">FAQ</span>
      <h2>Common questions from buyers</h2>
    </div>
    <div class="acc reveal" style="max-width:820px;margin-inline:auto">
      {% for faq in faqs %}
      <div class="acc__item">
        <button class="acc__btn" aria-expanded="false">{{ faq.question }}</button>
        <div class="acc__panel">
          <p>{{ faq.answer }}</p>
        </div>
      </div>
      {% endfor %}
      
    </div>
  </div>
</section>
