{% load static %}
<section class="section">
  <div class="container split split--reverse">
    <div class="split__media reveal"><img src="{% static 'assets/img/process.jpg' %}" alt="Handmade paper drying in the Himalayan sun" loading="lazy"></div>
    <div class="reveal">
      <span class="eyebrow">Our craft</span>
      <h2>{{ our_craft.title }}</h2>
      <p class="lead">{{ our_craft.description|slice:209 }}</p>
      <p>{{ our_craft.description|slice:"209:" }}</p>
      <div class="btn-row"><a class="btn btn--ghost" href="{% url 'craft' %}">See how it's made</a></div>
    </div>
  </div>
</section>
