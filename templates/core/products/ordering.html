{% load static %}
<section class="section">
  <div class="container">
    <div class="section-head center reveal">
      <span class="eyebrow">Ordering</span>
      <h2>How an order works</h2>
    </div>
    <div class="grid grid--4">
      {% for order in ordering %}
        <div class="step reveal">
          <span class="step__no">{{ order.s_no }}</span><h3>{{ order.title }}</h3><p>{{ order.description }}</p>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
