{% load static %}
<section class="section section--tint">
  <div class="container">
    <div class="section-head center reveal">
      <span class="eyebrow">Gallery</span>
      <h2>Inside our workshops</h2>
      <p class="lead">Tap any photograph to enlarge.</p>
    </div>
    <div class="gallery reveal">
      <button data-lightbox="{% static 'assets/img/process.jpg' %}" data-caption="Himalayan Foundation workshop"><img src="{% static 'assets/img/process.jpg' %}" alt="Workshop photograph" loading="lazy" /></button>
      <button data-lightbox="{% static 'assets/img/about.jpg' %}" data-caption="Himalayan Foundation workshop"><img src="{% static 'assets/img/about.jpg' %}" alt="Workshop photograph" loading="lazy" /></button>
      <button data-lightbox="{% static 'assets/img/cat-paper.jpg' %}" data-caption="Himalayan Foundation workshop"><img src="{% static 'assets/img/cat-paper.jpg' %}" alt="Workshop photograph" loading="lazy" /></button>
      <button data-lightbox="{% static 'assets/img/cat-pashmina.jpg' %}" data-caption="Himalayan Foundation workshop"><img src="{% static 'assets/img/cat-pashmina.jpg' %}" alt="Workshop photograph" loading="lazy" /></button>
      <button data-lightbox="{% static 'assets/img/cat-statues.jpg' %}" data-caption="Himalayan Foundation workshop"><img src="{% static 'assets/img/cat-statues.jpg' %}" alt="Workshop photograph" loading="lazy" /></button>
      <button data-lightbox="{% static 'assets/img/cat-herbals.jpg' %}" data-caption="Himalayan Foundation workshop"><img src="{% static 'assets/img/cat-herbals.jpg' %}" alt="Workshop photograph" loading="lazy" /></button>
    </div>
  </div>
</section>
