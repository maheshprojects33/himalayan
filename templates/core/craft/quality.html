{% load static %}
<section class="section">
  <div class="container">
    <div class="section-head center reveal">
      <span class="eyebrow">Quality</span>
      <h2>Our Checkpoints Before a Carton is Sealed</h2>
    </div>
    <div class="grid grid--3">
      {% for point in points %}
      <div class="step reveal">
        <span class="step__no">{{ point.s_no}}</span><h3>{{ point.title }}</h3><p>{{ point.description }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
