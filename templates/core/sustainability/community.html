{% load static %}

<section class="section">
  <div class="container split split--reverse">
    <div class="split__media reveal">
      <img src="{{ community.image.url }}" alt="{{ community.title }}" loading="lazy" />
    </div>
    <div class="reveal">
      <span class="eyebrow">Community</span>
      <h2>{{ community.title }}</h2>
      <p class="lead">{{ community.description }}</p>
      <ul class="ticks">
        {% for point in community.points_list %}
          <li>{{ point }}</li>
        {% endfor %}
      </ul>
      <div class="btn-row">
        <a class="btn btn--ghost" href="{% url 'contact' %}">Partner with us</a>
      </div>
    </div>
  </div>
</section>
